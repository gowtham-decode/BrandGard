version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: brandguard_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=BrandGuard AI Digital Risk Protection
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql://brandguard:brandguard_secure_pwd@postgres:5432/brandguard
      - SECRET_KEY=brandguard-production-super-secret-key-at-least-32-chars
      - CORS_ORIGINS=http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://localhost:5173
    depends_on:
      - postgres
    networks:
      - brandguard_net

  postgres:
    image: postgres:16-alpine
    container_name: brandguard_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=brandguard
      - POSTGRES_PASSWORD=brandguard_secure_pwd
      - POSTGRES_DB=brandguard
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - brandguard_net

networks:
  brandguard_net:
    driver: bridge

volumes:
  pgdata:
